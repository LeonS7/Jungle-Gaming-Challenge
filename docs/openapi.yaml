# Esta página documenta o console de atividade e a consulta paginada do histórico.
openapi: 3.1.0
info:
  title: API de wagering distribuído
  version: 1.0.0
  description: >-
    Contrato da consulta paginada de transações persistidas e da atividade local
    da API. A demonstração não possui autenticação e deve permanecer limitada ao
    host local.
servers:
  - url: http://127.0.0.1:3000
    description: Instância local para demonstração
paths:
  /:
    get:
      operationId: abrirConsoleDeAtividade
      summary: Abre o console local da API
      description: >-
        Entrega a página de acompanhamento de requisições e eventos recentes do
        processo. A página consulta GET /activity em intervalos regulares.
      responses:
        '200':
          description: Página HTML do console de atividade.
          content:
            text/html:
              schema:
                type: string
  /activity:
    get:
      operationId: consultarAtividadeRecente
      summary: Consulta registros recentes da instância atual
      description: >-
        Retorna registros mantidos em memória pelo processo atual. São limitados
        aos 500 mais recentes e desaparecem quando a instância reinicia. Não há
        agregação entre réplicas. Requisições HTTP são registradas sem corpo,
        cabeçalhos nem parâmetros. Este histórico não participa de idempotência
        nem de consistência financeira.
      parameters:
        - name: after
          in: query
          required: false
          description: Número de sequência da última entrada recebida.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        '200':
          description: Registros recentes depois do cursor informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiActivityPage'
        '400':
          description: Cursor inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /wallets/{walletId}/transactions:
    get:
      operationId: listarTransacoesDaCarteira
      summary: Lista o histórico persistido da carteira
      description: >-
        Consulta transações por carteira, da mais recente para a mais antiga.
        A operação é somente leitura e usa cursor opaco vinculado à carteira.
        O cursor não é uma assinatura criptográfica.
      parameters:
        - name: walletId
          in: path
          required: true
          description: Identificador UUID da carteira.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: Cursor opaco retornado pela página anterior.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Quantidade máxima de itens; o padrão é 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Página do histórico consultada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionsPage'
        '400':
          description: UUID, cursor ou limite inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Carteira inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Persistência temporariamente indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Falha interna inesperada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]{0,27})\.[0-9]{2}$'
          example: '80.00'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: BRL
    WalletTransaction:
      type: object
      required:
        - transactionId
        - providerId
        - externalTransactionId
        - playerId
        - walletId
        - roundId
        - gameId
        - kind
        - money
        - referenceExternalTransactionId
        - referenceTransactionId
        - status
        - failureCode
        - balance
        - createdAt
        - processedAt
      properties:
        transactionId:
          type: string
          format: uuid
        providerId:
          type: string
        externalTransactionId:
          type: string
        playerId:
          type: string
        walletId:
          type: string
          format: uuid
        roundId:
          type: string
        gameId:
          type: string
        kind:
          type: string
          enum: [OPENING, BET, WIN, LOSS, REFUND, ROLLBACK]
        money:
          $ref: '#/components/schemas/Money'
        referenceExternalTransactionId:
          type: [string, 'null']
        referenceTransactionId:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [PENDING, PENDING_REFERENCE, PROCESSED, REJECTED]
        failureCode:
          type: [string, 'null']
        balance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: [string, 'null']
          format: date-time
    WalletTransactionsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
        nextCursor:
          type: [string, 'null']
    ApiActivityRecord:
      type: object
      required: [sequence, occurredAt, level, message]
      properties:
        sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        occurredAt:
          type: string
          format: date-time
        level:
          type: string
          enum: [log, error, warn, debug, verbose, fatal]
        context:
          type: string
          maxLength: 120
        message:
          type: string
          maxLength: 4096
    ApiActivityPage:
      type: object
      required: [items, nextCursor, gap, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ApiActivityRecord'
        nextCursor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        gap:
          type: boolean
          description: Indica que há entradas anteriores fora do buffer ou da página inicial.
        hasMore:
          type: boolean
          description: Indica que há mais entradas retidas após a página atual.
    ApiError:
      type: object
      required: [statusCode, code, message]
      properties:
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string
